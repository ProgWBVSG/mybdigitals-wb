<!doctype html>
<html lang="es-ES">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#77797B">
<title>Mi tarjeta | {marca}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bebas+Neue&family=Big+Shoulders+Display:wght@600;700;800;900&family=Saira+Stencil+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../app.css">
<link rel="stylesheet" href="turnos.css">
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="garaje.css">
<link rel="stylesheet" href="cliente.css">
</head>
<body>
<div class="garaje" id="garaje" data-modo="carga" aria-hidden="true">
  <div class="g-sombra"></div>
  <div class="g-hueco"><div class="g-puerta"><div class="g-dorso"></div><div class="g-cara">
    <div class="g-medio">
      <span class="g-nombre">mira.cutz</span><span class="g-maneta"></span></div>
    <span class="g-placa" aria-hidden="true"></span>
  </div></div></div>
  <div class="g-jamba"></div><div class="g-jamba de"></div><div class="g-dintel"></div>
</div>
<script src="garaje.js"></script>
<div class="notif" id="notif" role="status"><i id="notif-inicial"></i><div><b id="notif-titulo"></b><span id="notif-texto"></span></div></div>

<main class="col">
  <div class="logo entra" data-logo></div>
  <p class="saludo entra" style="--i:1" id="saludo"></p>

  <!-- Todavía no tiene tarjeta -->
  <section id="alta" hidden style="margin-top:28px">
    <h1 style="font-size:2.2rem;margin-bottom:8px">Saca tu tarjeta</h1>
    <p class="nota" style="margin-bottom:22px">Cada corte suma un sello.</p>
    <form id="form-alta">
      <div class="campo">
        <label for="a-nombre">Tu nombre</label>
        <input id="a-nombre" type="text" autocomplete="name" maxlength="60" required>
      </div>
      <div class="campo">
        <label for="a-tel">Tu móvil (opcional)</label>
        <input id="a-tel" type="tel" autocomplete="tel" inputmode="tel" maxlength="20">
      </div>
      <button class="btn" type="submit">Crear mi tarjeta</button>
    </form>
  </section>

  <!-- Tarjeta -->
  <section id="vista" hidden>
    <div data-parte="tarjeta">
    <div class="escena entra" style="--i:2">
      <div class="papel">
        <div class="huecos" id="huecos" role="img"></div>
      </div>
    </div>

    <div class="estado entra" style="--i:3" aria-live="polite">
      <h1 id="estado-1"></h1>
      <p id="estado-2"></p>
    </div>

    <button class="proxima entra" style="--i:4" id="proxima" type="button" data-parte-ir="cita"></button>
    <div class="hitos entra" style="--i:5" id="hitos"></div>
    </div>

    <div data-parte="cita" hidden>
    <h1 class="titulo-parte">Tu cita</h1>
    <section class="turno-caja foco" id="turno-caja" aria-live="polite"></section>
    <button class="btn linea cerca" id="cerca" type="button" aria-pressed="false">Avisarme cuando pase cerca</button>
    </div>

    <div data-parte="club" hidden>
    <h1 class="titulo-parte" id="titulo-parte-club"></h1>
    <section class="club foco" id="club" aria-live="polite"></section>
    <section class="cortes" id="cortes"></section>
    </div>

    <section class="prueba" id="prueba" hidden><details>
      <summary>Para probar la demo</summary>
      <div class="pila">
        <button class="btn linea chico" type="button" data-probar="nfc">Acercar el móvil al NFC</button>
        <button class="btn linea chico" type="button" data-probar="cerca">Pasar cerca del local</button>
        <button class="btn linea chico" type="button" data-probar="recordatorio">Recibir el recordatorio de la cita</button>
      </div>
    </details></section>
  </section>
</main>

<nav class="abajo" id="abajo" aria-label="Secciones" hidden>
  <button type="button" data-parte-ir="tarjeta"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8" cy="10" r="1.400"/><circle cx="12" cy="10" r="1.400"/><circle cx="16" cy="10" r="1.400"/><path d="M7 15h6"/></svg>Tarjeta</button>
  <button type="button" data-parte-ir="cita"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.500" y="5" width="17" height="15.500" rx="2"/><path d="M3.500 10h17M8 3v4M16 3v4"/></svg>Cita</button>
  <button type="button" id="ver-codigo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5M8 8h3v3H8zM13 13h3v3h-3zM13 8h3M8 13v3"/></svg>Mi código</button>
  <button type="button" data-parte-ir="club"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.500 2.600 5.400 5.900.8-4.300 4.100 1 5.900-5.200-2.800-5.200 2.800 1-5.900L3.500 9.700l5.900-.8z"/></svg>Club</button>
</nav>

<p class="firma">Hecho por <a href="https://www.mybdigitals.com" target="_blank" rel="noopener">MYB Digitals</a></p>

<dialog id="hoja-codigo" aria-labelledby="titulo-codigo">
  <div class="hoja">
    <h2 id="titulo-codigo">Muéstraselo a tu barbero</h2>
    <div class="qr" id="qr"></div>
    <p class="numero" id="numero"></p>
    <button class="btn linea" type="button" id="cerrar-codigo">Cerrar</button>
  </div>
</dialog>

<dialog id="hoja-turno" aria-labelledby="titulo-turno">
  <div class="hoja ancha">
    <h2 id="titulo-turno">Pide tu cita</h2>
    <p class="antes" id="turno-antes" hidden></p>
    <div id="selector"></div>
    <p class="resumen-turno" id="turno-resumen">Elige un horario</p>
    <div class="pila">
      <button class="btn" type="button" id="turno-ok" disabled>Reservar cita</button>
      <button class="btn linea" type="button" id="turno-cerrar">Volver</button>
    </div>
    <p class="politica" id="turno-politica"></p>
  </div>
</dialog>

<dialog id="hoja-cancelar" aria-labelledby="titulo-cancelar">
  <div class="hoja">
    <h2 id="titulo-cancelar">¿Cancelas tu cita?</h2>
    <p id="cancelar-que" style="margin-top:8px;font-weight:600"></p>
    <p class="politica" id="cancelar-pol"></p>
    <div class="pila" style="margin-top:18px">
      <button class="btn" type="button" id="cancelar-cambiar">Mejor la cambio de día</button>
      <button class="btn linea" type="button" id="cancelar-si">Sí, cancelar</button>
    </div>
  </div>
</dialog>

<dialog id="hoja-club" aria-labelledby="titulo-club">
  <div class="hoja">
    <h2 id="titulo-club"></h2>
    <p class="club-precio" id="club-precio"></p>
    <p id="club-detalle"></p>
    <div class="pila" style="margin-top:18px">
      <button class="btn" type="button" id="club-si">Sumarme</button>
      <button class="btn linea" type="button" id="club-no">Ahora no</button>
    </div>
    <p class="nota" style="margin-top:12px;color:var(--tinta-suave)">En esta demo no se cobra nada.</p>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="marca.js"></script>
<script src="../datos.js"></script>
<script src="turnos.js"></script>
<script>
(function () {
  "use strict";
  const T = window.TARJETA, K = T.CONFIG, $ = (s) => document.querySelector(s);
  let codigo = new URLSearchParams(location.search).get("c") || T.guardado.leer("miTarjeta");
  let previos = -1;

  T.vestir();

  // Cambia un texto con un fundido suave, sólo si de verdad cambió.
  function poner(sel, valor, esHtml) {
    const el = $(sel);
    if (el.dataset.v === valor) return;
    const primera = el.dataset.v === undefined;
    el.dataset.v = valor;
    if (esHtml) el.innerHTML = valor; else el.textContent = valor;
    if (primera) return;
    el.classList.remove("cambia"); void el.offsetWidth; el.classList.add("cambia");
  }

  function pintarClub(c) {
    const M = K.membresia, caja = $("#club");
    if (!M) { caja.hidden = true; return; }
    const al = T.alDia(c);
    const h = !c.socio
      ? '<p class="club-precio"><b>' + T.pesos(M.precio) + "</b> por mes</p><p>" + T.esc(M.detalle) + '</p><button class="btn linea" type="button" data-club="alta">Sumarme al club</button>'
      : al
        ? "<h2>Eres socio</h2><p>" + T.esc(M.detalle) + '</p><p class="rotulo" style="margin-top:10px">Próximo cobro ' + T.cuando(c.socio.pagoHasta) + '</p><button class="enlace" type="button" data-club="baja">Darme de baja</button>'
        : "<h2>Tu cuota venció</h2><p>" + T.esc(M.nombre) + " · " + T.pesos(M.precio) + ' por mes</p><button class="btn linea" type="button" data-club="pagar">Pagar la cuota</button>';
    caja.classList.toggle("socio", al);
    if (caja.dataset.v !== h) { caja.dataset.v = h; caja.innerHTML = h; }
  }

  function pintar() {
    const c = codigo ? T.porCodigo(codigo) : null;
    $("#alta").hidden = !!c;
    $("#vista").hidden = !c; $("#abajo").hidden = !c;
    $("#saludo").textContent = c ? "Hola, " + c.nombre.split(" ")[0] : "";
    if (!c) return;

    const n = T.sellosDe(c).length, total = K.sellos;
    let html = "";
    for (let i = 0; i < total; i++) {
      const hito = T.hitoEn(i + 1), lleno = i < n, nuevo = previos >= 0 && i >= previos && lleno;
      html += '<div class="hueco' + (hito ? " premio" : "") + (lleno ? " lleno" : "") + '">' +
        (lleno ? T.sello(i, c.codigo, !!hito, nuevo) : hito ? "−" + hito.pct + "%" : i + 1) + "</div>";
    }
    const huecos = $("#huecos");
    huecos.innerHTML = html;
    huecos.setAttribute("aria-label", n + " de " + total + " sellos");
    // Al terminar de estamparse, el sello queda como cualquier otro.
    huecos.querySelectorAll(".sello.nuevo").forEach((s) => {
      const soltar = () => s.classList.remove("nuevo");
      s.addEventListener("animationend", soltar, { once: true });
      setTimeout(soltar, 700);
    });
    if (previos >= 0 && n > previos && navigator.vibrate) navigator.vibrate(35);
    previos = n;

    const p = T.proximo(c), completa = n >= total;
    if (completa) {
      poner("#estado-1", "¡Tarjeta completa!");
      poner("#estado-2", "Tu próximo corte abre <em>una nueva</em>", true);
    } else if (p.faltan === 1) {
      poner("#estado-1", "Tu próximo corte");
      poner("#estado-2", "tiene <em>" + p.pct + "% de descuento</em>", true);
    } else {
      poner("#estado-1", "Te faltan " + p.faltan + " cortes");
      poner("#estado-2", "para tu <em>" + p.pct + "% de descuento</em>", true);
    }

    $("#hitos").innerHTML = K.hitos.map((h) => {
      const usado = n >= h.en, sigue = !completa && h.en === p.en;
      return '<div class="hito-caja' + (usado ? " usado" : sigue ? " sigue" : "") + '"><b>−' + h.pct + "%</b><small>" +
        (usado ? "Usado" : h.en + ".º corte") + "</small></div>";
    }).join("");

    pintarClub(c);

    pintarTurno(c);
    pintarCortes(c);
  }

  /* ---------- Partes: Tarjeta, Cita y Club ---------- */
  let parte = "tarjeta";
  function verParte(p) {
    parte = ["tarjeta", "cita", "club"].includes(p) ? p : "tarjeta";
    document.querySelectorAll("[data-parte]").forEach((x) => { x.hidden = x.dataset.parte !== parte; if (!x.hidden) { x.classList.remove("cambia"); void x.offsetWidth; x.classList.add("cambia"); } });
    document.querySelectorAll("#abajo [data-parte-ir]").forEach((b) => { if (b.dataset.parteIr === parte) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    window.scrollTo(0, 0);
  }
  document.addEventListener("click", (ev) => { const b = ev.target.closest("[data-parte-ir]"); if (b) verParte(b.dataset.parteIr); });
  function pintarCortes(c) {
    const l = c.visitas.slice(-5).reverse();
    const h = "<h2>Tus últimos cortes</h2>" + (l.length ? "<ul>" + l.map((v) => { const i = c.visitas.indexOf(v) % K.sellos + 1; return "<li><span>" + T.conAnio(v.fecha) + "</span><b>Sello " + i + (v.descuento ? " <em>−" + v.descuento + "%</em>" : "") + "</b></li>"; }).join("") + "</ul>" : "<p>Todavía no tienes cortes.</p>");
    const caja = $("#cortes"); if (caja.dataset.v !== h) { caja.dataset.v = h; caja.innerHTML = h; }
    $("#titulo-parte-club").textContent = K.membresia ? K.membresia.nombre : "Tus cortes";
  }
  T.conAnio = (iso) => new Date(iso).toLocaleDateString("es-ES", { day: "numeric", month: "long" });

  /* ---------- Turnos ---------- */
  const TU = window.TURNOS, KT = TU.K;
  function pintarTurno(c) {
    const caja = $("#turno-caja"), t = TU.proximoDe(c.codigo);
    let h;
    if (t) {
      const s = TU.servicio(t.servicio);
      h = '<h2>' + TU.conMayus(TU.cuandoDia(TU.clave(t.inicio))) + " · <em>" + TU.hora(t.inicio) + "</em></h2>" +
        "<p>" + T.esc(s.nombre) + " con " + T.esc(TU.barbero(t.barbero).nombre) + " · " + T.pesos(s.precio) + "</p>" +
        '<span class="estado-turno' + (t.confirmado ? " ok" : "") + '">' + (t.confirmado ? "✓ Confirmada" : "Sin confirmar") + "</span>" +
        (t.confirmado ? "" : '<button class="btn brilla" type="button" data-turno="confirmar">Confirmo que voy</button>') +
        '<button class="btn linea" type="button" data-turno="cambiar"' + (t.confirmado ? "" : ' style="margin-top:10px"') + ">Cambiar día u hora</button>" +
        '<div class="fila"><button class="enlace" type="button" data-turno="cancelar">Cancelar cita</button>' +
        '<a class="enlace" target="_blank" rel="noopener" href="' + TU.calendario(t) + '">Añadir a mi calendario</a></div>';
    } else {
      const esp = TU.enEspera(c.codigo)[0];
      h = "<h2>Pide tu cita</h2><p>Elige servicio, barbero y horario. Te llega la confirmación aquí.</p>" +
        (esp ? '<p class="rotulo" style="margin-top:12px;color:var(--acento)">Estás en lista de espera para ' + TU.elDia(esp.dia) + "</p>" : "") +
        '<button class="btn brilla" type="button" data-turno="pedir">Pedir cita</button>';
    }
    $("#proxima").innerHTML = t ? "<span>Tu próxima cita</span><b>" + TU.conMayus(TU.cuandoDia(TU.clave(t.inicio))) + ", " + TU.hora(t.inicio) + "</b>" + (t.confirmado ? "" : "<em>Confirmar</em>") : "<span>No tienes cita</span><b>Pide la próxima</b>";
    caja.classList.toggle("tiene", !!t);
    if (caja.dataset.v !== h) { caja.dataset.v = h; caja.innerHTML = h; }
  }

  const hojaTurno = $("#hoja-turno"), hojaCancelar = $("#hoja-cancelar");
  let modo = "pedir", elegidoTurno = null, sel = null;
  function abrirSelector(m) {
    const c = T.porCodigo(codigo), t = TU.proximoDe(codigo);
    modo = m; elegidoTurno = null;
    $("#titulo-turno").textContent = m === "cambiar" ? "Cambia tu cita" : "Pide tu cita";
    $("#turno-ok").textContent = m === "cambiar" ? "Pasar mi cita aquí" : "Reservar cita";
    $("#turno-politica").textContent = "Puedes cambiarla o cancelarla sin coste hasta " + KT.cancelarHasta + " horas antes.";
    const antes = $("#turno-antes");
    antes.hidden = m !== "cambiar" || !t;
    if (m === "cambiar" && t) antes.innerHTML = "Tenías: <s>" + TU.fechaTurno(t) + "</s> · " + T.esc(TU.servicio(t.servicio).nombre);
    sel = TU.selector($("#selector"), {
      servicio: m === "cambiar" && t ? t.servicio : null, barbero: m === "cambiar" && t ? t.barbero : null, ignorar: m === "cambiar" && t ? t.id : null,
      cambio: (r) => { elegidoTurno = r; $("#turno-resumen").textContent = r ? r.texto : "Elige un horario"; $("#turno-ok").disabled = !r; },
      espera: (dia) => { const r = TU.anotar(c.codigo, c.nombre, dia); hojaTurno.close(); notificar("Te anotamos en la lista de espera", "Si alguien cancela " + TU.elDia(dia) + ", te avisamos."); },
    });
    hojaTurno.showModal();
  }
  $("#turno-ok").addEventListener("click", () => {
    const c = T.porCodigo(codigo); if (!c || !elegidoTurno) return;
    const r = modo === "cambiar" ? TU.reprogramar(TU.proximoDe(codigo).id, elegidoTurno.inicio, elegidoTurno.barbero)
                                 : TU.reservar({ codigo: c.codigo, nombre: c.nombre, barbero: elegidoTurno.barbero, servicio: elegidoTurno.servicio, inicio: elegidoTurno.inicio });
    if (!r.ok) { notificar(K.nombre, "Ese horario se acaba de ocupar. Elige otro."); sel.repintar(); return; }
    hojaTurno.close();
    if (modo === "cambiar") notificar("Cita cambiada", "Ahora: " + TU.fechaTurno(r.turno) + ". Tu hora anterior queda libre para otro cliente.");
    else notificar("Cita reservada", TU.conMayus(TU.fechaTurno(r.turno)) + " con " + TU.barbero(r.turno.barbero).nombre + ". Te la recordamos el día antes.");
  });
  $("#turno-cerrar").addEventListener("click", () => hojaTurno.close());
  hojaTurno.addEventListener("click", (ev) => { if (ev.target === hojaTurno) hojaTurno.close(); });

  function abrirCancelar() {
    const t = TU.proximoDe(codigo); if (!t) return;
    const h = TU.horasAntes(t);
    $("#cancelar-que").textContent = TU.conMayus(TU.fechaTurno(t)) + " · " + TU.servicio(t.servicio).nombre + " con " + TU.barbero(t.barbero).nombre;
    $("#cancelar-pol").textContent = h >= KT.cancelarHasta
      ? "Faltan más de " + KT.cancelarHasta + " horas: la cancelas sin problema y la hora queda libre para otro cliente."
      : "Falta menos de " + KT.cancelarHasta + " horas. Puedes cancelarla igual, pero el local verá que fue a última hora.";
    hojaCancelar.showModal();
  }
  $("#cancelar-si").addEventListener("click", () => {
    const t = TU.proximoDe(codigo); hojaCancelar.close(); if (!t) return;
    if (TU.cancelar(t.id, "cliente").ok) notificar("Cita cancelada", "Dejamos la hora libre para otro cliente. Cuando quieras, pide otra.");
  });
  $("#cancelar-cambiar").addEventListener("click", () => { hojaCancelar.close(); abrirSelector("cambiar"); });
  hojaCancelar.addEventListener("click", (ev) => { if (ev.target === hojaCancelar) hojaCancelar.close(); });

  $("#turno-caja").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-turno]"); if (!b) return;
    const a = b.dataset.turno, t = TU.proximoDe(codigo);
    if (a === "pedir") abrirSelector("pedir");
    else if (a === "cambiar") abrirSelector("cambiar");
    else if (a === "cancelar") abrirCancelar();
    else if (a === "confirmar" && t && TU.confirmar(t.id).ok) notificar("¡Listo, te esperamos!", TU.conMayus(TU.fechaTurno(t)) + " con " + TU.barbero(t.barbero).nombre + ".");
  });
  function recordatorio() {
    const t = TU.proximoDe(codigo);
    if (!t) return notificar(K.nombre, "No tienes citas pedidas. Pide una desde tu tarjeta.");
    notificar("Recordatorio de tu cita", TU.conMayus(TU.fechaTurno(t)) + " con " + TU.barbero(t.barbero).nombre + ". ¿Confirmas o la cambias?");
    verParte("cita"); const caja = $("#turno-caja"); caja.scrollIntoView({ behavior: "smooth", block: "center" });
    caja.classList.remove("recuerda"); void caja.offsetWidth; caja.classList.add("recuerda");
  }

  /* Aviso con forma de notificación */
  let reloj;
  function notificar(titulo, texto) {
    $("#notif-inicial").textContent = K.nombre.charAt(0);
    $("#notif-titulo").textContent = titulo;
    $("#notif-texto").textContent = texto;
    const n = $("#notif");
    n.classList.add("ver");
    clearTimeout(reloj);
    reloj = setTimeout(() => n.classList.remove("ver"), 5200);
    // Si el cliente dio permiso, también sale como notificación del sistema.
    try { if (window.Notification && Notification.permission === "granted") new Notification(titulo, { body: texto }); } catch (e) { /* algunos móviles no lo permiten desde la página */ }
  }
  function avisarCerca() {
    const c = T.porCodigo(codigo);
    if (c) notificar("Estás cerca de " + K.nombre, T.textoCerca(c));
  }

  /* Aviso por cercanía: funciona mientras la tarjeta está abierta. */
  let vigilando = null;
  function vigilar() {
    if (vigilando !== null || !navigator.geolocation) return;
    vigilando = navigator.geolocation.watchPosition((pos) => {
      const metros = T.distanciaAlLocal(pos.coords.latitude, pos.coords.longitude);
      const ultimo = Number(T.guardado.leer("ultimoAviso")) || 0;
      if (metros <= K.local.radio && Date.now() - ultimo > 6 * 36e5) {
        T.guardado.poner("ultimoAviso", String(Date.now()));
        avisarCerca();
      }
    }, () => {}, { enableHighAccuracy: false, maximumAge: 60000 });
  }
  function pintarCerca() {
    const activo = T.guardado.leer("avisos") === "1";
    const b = $("#cerca");
    b.setAttribute("aria-pressed", activo);
    b.textContent = activo ? "Avisos por cercanía activados" : "Avisarme cuando pase cerca";
    if (activo) vigilar();
  }
  $("#cerca").addEventListener("click", () => {
    if (T.guardado.leer("avisos") === "1") {
      T.guardado.poner("avisos", "0");
      if (vigilando !== null) { navigator.geolocation.clearWatch(vigilando); vigilando = null; }
    } else {
      T.guardado.poner("avisos", "1");
      try { if (window.Notification && Notification.permission === "default") Notification.requestPermission(); } catch (e) { /* sin soporte */ }
    }
    pintarCerca();
  });

  /* Sello por NFC, cuando la página de ejemplo lo simula. */
  function selloNfc() {
    const c = T.porCodigo(codigo);
    if (!c) return;
    const r = T.sumar(c.codigo, "nfc");
    if (!r.ok) return notificar(K.nombre, "Ya sumaste tu sello de hoy.");
    notificar("Sello " + r.numero + " de " + K.sellos, r.descuento ? "Este corte tiene " + r.descuento + "% de descuento." : "Sumaste un sello en " + K.nombre + ".");
  }
  window.addEventListener("message", (ev) => {
    const d = ev.data || {};
    if (d.marca !== K.id) return;
    if (d.tipo === "cerca") avisarCerca();
    if (d.tipo === "nfc") selloNfc();
    if (d.tipo === "recordatorio") recordatorio();
  });

  /* Cuota mensual */
  const hojaClub = $("#hoja-club");
  $("#club").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-club]");
    if (!b) return;
    const M = K.membresia, accion = b.dataset.club;
    if (accion === "alta") {
      $("#titulo-club").textContent = M.nombre;
      $("#club-precio").innerHTML = "<b>" + T.pesos(M.precio) + "</b> por mes";
      $("#club-detalle").textContent = M.detalle;
      hojaClub.showModal();
    } else if (accion === "baja") {
      if (confirm("¿Darte de baja de " + M.nombre + "?")) T.bajaSocio(codigo);
    } else if (accion === "pagar") {
      if (T.cobrarCuota(codigo).ok) notificar(M.nombre, "Cuota al día. ¡Gracias!");
    }
  });
  $("#club-si").addEventListener("click", () => {
    hojaClub.close();
    if (T.altaSocio(codigo).ok) notificar("Ya eres socio de " + K.membresia.nombre, K.membresia.detalle + ".");
  });
  $("#club-no").addEventListener("click", () => hojaClub.close());
  hojaClub.addEventListener("click", (ev) => { if (ev.target === hojaClub) hojaClub.close(); });

  /* Botones de prueba: sólo con ?demo=1 */
  if (new URLSearchParams(location.search).get("demo") === "1") $("#prueba").hidden = false;
  $("#prueba").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-probar]");
    if (!b) return;
    if (b.dataset.probar === "recordatorio") return recordatorio();
    verParte("tarjeta");
    if (b.dataset.probar === "nfc") selloNfc(); else avisarCerca();
  });

  /* Detalles de movimiento, sólo con mouse: la tarjeta se inclina y las cajas tienen un foco de luz. */
  if (matchMedia("(hover:hover) and (pointer:fine)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const escena = document.querySelector(".escena"), papel = document.querySelector(".papel");
    escena.addEventListener("pointermove", (ev) => {
      const r = papel.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width - 0.5, y = (ev.clientY - r.top) / r.height - 0.5;
      papel.style.transform = "rotate(-2.5deg) rotateX(" + (-y * 9).toFixed(2) + "deg) rotateY(" + (x * 11).toFixed(2) + "deg)";
    });
    escena.addEventListener("pointerleave", () => { papel.style.transform = ""; });
    document.addEventListener("pointermove", (ev) => {
      const caja = ev.target.closest && ev.target.closest(".foco");
      if (!caja) return;
      const r = caja.getBoundingClientRect();
      caja.style.setProperty("--mx", ev.clientX - r.left + "px");
      caja.style.setProperty("--my", ev.clientY - r.top + "px");
    });
  }

  $("#form-alta").addEventListener("submit", (e) => {
    e.preventDefault();
    const nombre = $("#a-nombre").value.trim();
    if (!nombre) return;
    const c = T.crear({ nombre, tel: $("#a-tel").value });
    codigo = c.codigo;
    T.guardado.poner("miTarjeta", codigo);
    history.replaceState(null, "", "?c=" + codigo);
    previos = -1;
    pintar();
  });

  const hoja = $("#hoja-codigo");
  $("#ver-codigo").addEventListener("click", () => {
    const c = T.porCodigo(codigo);
    if (!c) return;
    $("#numero").textContent = c.codigo;
    const caja = $("#qr");
    if (typeof qrcode === "function") {
      const q = qrcode(0, "M");
      q.addData(new URL("panel.html?c=" + c.codigo, location.href).href);
      q.make();
      caja.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
      caja.hidden = false;
    } else {
      caja.hidden = true; // sin conexión: alcanza con el número
    }
    hoja.showModal();
  });
  $("#cerrar-codigo").addEventListener("click", () => hoja.close());
  hoja.addEventListener("click", (e) => { if (e.target === hoja) hoja.close(); });

  window.addEventListener("tarjeta:cambio", pintar);
  if (codigo && T.porCodigo(codigo)) T.guardado.poner("miTarjeta", codigo);
  pintar();
  verParte(location.hash.slice(1));
  pintarCerca();
})();
</script>
</body>
</html>
