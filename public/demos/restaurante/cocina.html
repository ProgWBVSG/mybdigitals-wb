<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17191D">
<title>La Esquina · Cocina</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317191D'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-style='italic' font-weight='700' font-size='15' fill='white' text-anchor='middle'%3ELE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fondo:#17191D;--panel:#1F2227;--linea:#2C3037;--txt:#F2EFE9;--gris:#9AA0A8;--papel:#FAF7F0;--tinta:#1F1A16;--verde:#3E7A2E;--verde2:#5B7A35;--gris-t:#4A4F57;--ambar:#B8761E;--rojo:#B8341F;--mod:#C0331F;--mono:"Geist Mono",ui-monospace,monospace;--sans:"Geist",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:var(--fondo);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
.ic{display:block;flex:none}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:calc(14px + env(safe-area-inset-top)) clamp(14px,3vw,24px) 14px;background:var(--fondo);border-bottom:1.5px solid var(--linea)}
header h1{font:600 18px var(--mono);letter-spacing:.22em}
header .cont{display:flex;gap:6px;font:600 13px var(--mono);color:var(--gris)}
header .cont b{color:var(--txt)}
header .reloj{margin-left:auto;font:500 15px var(--mono);color:var(--gris);white-space:nowrap}
.llamados{display:flex;gap:10px;overflow-x:auto;padding:12px clamp(14px,3vw,24px) 0;scrollbar-width:none}
.llamados:empty{display:none}
.llamado{flex:none;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-radius:10px;background:#2A2416;border:1.5px solid #5C4A1E;animation:entra .4s}
.llamado .ic{color:#E0A93B}
.llamado b{font:700 14px var(--mono)}.llamado span{display:block;font-size:13px;color:#D8CFBF}
.llamado button{height:40px;padding:0 14px;border-radius:8px;background:#E0A93B;color:#1A1408;font-weight:700;font-size:14px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:12px clamp(14px,3vw,24px) 24px;align-items:start}
.vacio{grid-column:1/-1;padding:80px 20px;text-align:center;color:var(--gris);font-size:16px}
.t{display:flex;flex-direction:column;min-height:min(62vh,520px);background:var(--papel);color:var(--tinta);border-radius:6px;overflow:hidden;animation:entra .45s cubic-bezier(.2,.8,.2,1)}
.t.nuevo{box-shadow:0 0 0 3px #7FB069}
.t .cab{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;background:var(--gris-t)}
.t .cab b{font:700 17px var(--mono);letter-spacing:.04em}.t .cab span{font:600 15px var(--mono)}
.t.c-verde .cab{background:var(--verde)}.t.c-ambar .cab{background:var(--ambar)}.t.c-rojo .cab{background:var(--rojo)}
.t .sub{display:flex;justify-content:space-between;padding:8px 14px;font:500 12px var(--mono);color:#7d756b;border-bottom:1px dashed #D9D1C4}
.t ul{list-style:none;flex:1;padding:6px 0}
.t li{display:flex;gap:12px;width:100%;padding:9px 14px;text-align:left;cursor:pointer}
.t li .n{font:700 17px var(--mono);min-width:16px}
.t li .tx{flex:1}.t li .tx b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.t li .m{display:block;margin-top:3px;font-size:14px;font-weight:800;color:var(--mod);letter-spacing:.02em}
.t li .nt{display:block;margin-top:3px;font-size:14px;font-style:italic;color:#5d554c}
.t li.hecho .tx b,.t li.hecho .n{text-decoration:line-through;opacity:.4}
.t li.hecho .m,.t li.hecho .nt{opacity:.4}
.t .listo{display:flex;align-items:center;justify-content:center;gap:10px;height:60px;background:var(--verde2);color:#fff;font:700 18px var(--mono);letter-spacing:.06em}
.t .listo:active{filter:brightness(.9)}
.salieron{padding:0 clamp(14px,3vw,24px) calc(24px + env(safe-area-inset-bottom))}
.salieron h2{font:600 13px var(--mono);letter-spacing:.18em;color:var(--gris);padding:14px 0 10px;border-top:1.5px solid var(--linea)}
.salieron .fila{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--linea);font-size:14px;color:var(--gris)}
.salieron .fila b{font:700 14px var(--mono);color:var(--txt);min-width:74px}
.salieron .fila span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.salieron .fila button{font-size:13px;text-decoration:underline;color:var(--gris);padding:8px 0}
.aviso{position:fixed;z-index:9;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,160%);display:flex;gap:10px;align-items:center;padding:14px 20px;border-radius:12px;background:#7FB069;color:#0F1A0A;font:700 15px var(--mono);box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.aviso.ve{transform:translate(-50%,0)}
@keyframes entra{from{opacity:0;transform:translateY(-16px)}}
@media (max-width:560px){header .cont{display:none}main{grid-template-columns:1fr}.t{min-height:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1>COCINA</h1><span class="cont" id="cont"></span><span class="reloj" id="reloj"></span></header>
<div class="llamados" id="llamados"></div>
<main id="tickets"></main>
<section class="salieron" id="salieron"></section>
<div class="aviso" id="aviso"></div>
<script type="module">
import { leer, guardar, alCambiar, esc, ic } from './datos.js';
const $ = s => document.querySelector(s);
// pedidos de ejemplo de otras mesas (para que la pantalla no arranque vacía)
let base; try { base = +sessionStorage.getItem('laesquina-cocina-base'); } catch {} if (!base) { base = Date.now(); try { sessionStorage.setItem('laesquina-cocina-base', base); } catch {} }
const EJ = [
  { id: 'ej3', mesa: '3', creado: base - 400000, estado: 'cocina', items: [{ cant: 2, nombre: 'Bondiola braseada', mods: [] }, { cant: 1, nombre: 'Papas rústicas', mods: [] }] },
  { id: 'ej12', mesa: '12', creado: base - 555000, estado: 'cocina', items: [{ cant: 1, nombre: 'Ñoquis de papa', mods: ['Sin queso rallado'] }, { cant: 1, nombre: 'Malbec Reserva', mods: [] }] },
  { id: 'ej4', mesa: '4', creado: base - 130000, estado: 'cocina', items: [{ cant: 2, nombre: 'Empanadas de carne', mods: [] }, { cant: 1, nombre: 'Provoleta a la parrilla', mods: [] }, { cant: 2, nombre: 'Cerveza tirada', mods: [] }] },
];
const estadoEj = {}, tachados = new Set(); let vistos = null;
const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const color = ms => ms < 300000 ? 'c-verde' : ms < 600000 ? '' : ms < 900000 ? 'c-ambar' : 'c-rojo';
function todos() { const reales = leer().pedidos.map(p => ({ ...p, real: true })); const ej = EJ.map(p => ({ ...p, estado: estadoEj[p.id] || 'cocina', listoEn: estadoEj[p.id + 't'] })); return [...ej, ...reales].sort((a, b) => a.creado - b.creado); }
function aviso(t) { const a = $('#aviso'); a.innerHTML = ic('campana', 20) + t; a.classList.add('ve'); clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.remove('ve'), 3000); }
function pintar() { const ps = todos(), ahora = Date.now(), abiertos = ps.filter(p => p.estado === 'cocina'), hechos = ps.filter(p => p.estado !== 'cocina').sort((a, b) => (b.listoEn || b.creado) - (a.listoEn || a.creado)).slice(0, 8);
  const ids = new Set(abiertos.map(p => p.id)); if (vistos) for (const p of abiertos) if (!vistos.has(p.id)) aviso(`Pedido nuevo · Mesa ${esc(p.mesa)}`); vistos = ids;
  $('#cont').innerHTML = `<b>${abiertos.length}</b> en marcha`;
  $('#tickets').innerHTML = abiertos.length ? abiertos.map(p => { const t = ahora - p.creado; return `<article class="t ${color(t)} ${t < 20000 ? 'nuevo' : ''}"><div class="cab"><b>MESA ${esc(p.mesa)}</b><span data-t="${p.creado}">${mmss(t)}</span></div><div class="sub"><span>${p.real ? 'Desde la carta' : 'Mozo'}</span><span>${new Date(p.creado).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false })}</span></div>
    <ul>${p.items.map((i, k) => `<li class="${tachados.has(p.id + k) ? 'hecho' : ''}" data-tachar="${p.id + k}"><span class="n">${i.cant}</span><span class="tx"><b>${esc(i.nombre)}</b>${i.mods.map(m => `<span class="m">— ${esc(m).toUpperCase()}</span>`).join('')}${i.nota ? `<span class="nt">“${esc(i.nota)}”</span>` : ''}</span></li>`).join('')}</ul>
    <button class="listo" data-listo="${p.id}">${ic('check', 20)} LISTO</button></article>`; }).join('') : '<p class="vacio">No hay pedidos en marcha. Cuando una mesa pida desde la carta, aparece acá.</p>';
  $('#salieron').innerHTML = hechos.length ? `<h2>SALIERON</h2>${hechos.map(p => `<div class="fila"><b>MESA ${esc(p.mesa)}</b><span>${p.items.map(i => `${i.cant} ${esc(i.nombre)}`).join(' · ')}</span>${p.estado === 'listo' ? `<button data-volver="${p.id}">Volver a abrir</button>` : '<span style="flex:none">Pagado</span>'}</div>`).join('')}` : '';
  const ll = leer().llamados.filter(l => !l.atendido).slice(-6);
  $('#llamados').innerHTML = ll.map(l => `<div class="llamado">${ic(l.tipo === 'cuenta' ? 'cuenta' : 'campana', 22)}<span><b>MESA ${esc(l.mesa)}</b><span>${l.tipo === 'cuenta' ? `Pide la cuenta · ${l.medio === 'posnet' ? 'con posnet' : 'efectivo'}` : 'Llama al mozo'}</span></span><button data-atender="${l.id}">Voy</button></div>`).join('');
  if (window.__llam != null && ll.length > window.__llam) aviso(`Mesa ${esc(ll[ll.length - 1].mesa)} ${ll[ll.length - 1].tipo === 'cuenta' ? 'pide la cuenta' : 'llama al mozo'}`); window.__llam = ll.length; }
document.body.addEventListener('click', e => { const t = e.target.closest('[data-listo],[data-tachar],[data-volver],[data-atender]'); if (!t) return;
  if (t.dataset.tachar) { const k = t.dataset.tachar; tachados.has(k) ? tachados.delete(k) : tachados.add(k); t.classList.toggle('hecho'); return; }
  if (t.dataset.listo) { const id = t.dataset.listo; if (id.startsWith('ej')) { estadoEj[id] = 'listo'; estadoEj[id + 't'] = Date.now(); pintar(); } else guardar(s => { const p = s.pedidos.find(x => x.id === id); if (p) { p.estado = 'listo'; p.listoEn = Date.now(); } }); }
  if (t.dataset.volver) { const id = t.dataset.volver; if (id.startsWith('ej')) { estadoEj[id] = 'cocina'; pintar(); } else guardar(s => { const p = s.pedidos.find(x => x.id === id); if (p) p.estado = 'cocina'; }); }
  if (t.dataset.atender) guardar(s => { const l = s.llamados.find(x => x.id === t.dataset.atender); if (l) l.atendido = true; });
  pintar(); });
alCambiar(pintar); pintar();
setInterval(() => { const a = Date.now(); $('#reloj').textContent = 'La Esquina · ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
  document.querySelectorAll('[data-t]').forEach(s => { const t = a - +s.dataset.t; s.textContent = mmss(t); const art = s.closest('.t'); art.classList.remove('c-verde', 'c-ambar', 'c-rojo'); const c = color(t); if (c) art.classList.add(c); if (t > 20000) art.classList.remove('nuevo'); }); }, 1000);
$('#reloj').textContent = 'La Esquina · ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
</script>
</body>
</html>
