<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230B0E12%27/%3E%3Crect x=%2712%27 y=%275%27 width=%278%27 height=%2722%27 rx=%274%27 fill=%27%23F0EDE4%27/%3E%3Cpath d=%27M12 14l8-5v4l-8 5zm0 9l8-5v4l-8 5z%27 fill=%27%23E8712F%27/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tu Barbería</title>
<style>#carga{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0B0E12;color:#F0EDE4;transition:opacity .3s}
#carga.fuera{opacity:0;pointer-events:none}
#carga .poste{width:38px;height:96px;border-radius:19px;overflow:hidden;border:3px solid #F0EDE4}
#carga .poste i{display:block;height:200%;background:repeating-linear-gradient(-35deg,#E8712F 0 14px,#F0EDE4 14px 28px,#11161B 28px 42px,#F0EDE4 42px 56px);animation:gira 1.1s linear infinite}
#carga b{font:800 clamp(2rem,11vw,3.2rem)/1 "Bahnschrift Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,sans-serif;letter-spacing:.08em;text-align:center}
#carga span{width:150px;height:3px;border-radius:3px;background:#273039;overflow:hidden}
#carga span i{display:block;height:100%;background:#E8712F;transform-origin:left;animation:llena-carga .6s ease-out both}
@keyframes gira{to{transform:translateY(-27%)}}@keyframes llena-carga{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){#carga i{animation:none!important}}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Bebas+Neue&family=Big+Shoulders+Display:wght@600;700;800;900&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="carga" role="status" aria-label="Cargando Tu Barbería"><div class="poste"><i></i></div><b>TU BARBERÍA</b><span><i></i></span></div>
<script>(function(){var t0=performance.now(),hecho;function fuera(){if(hecho)return;hecho=1;setTimeout(function(){var c=document.getElementById('carga');if(!c)return;c.classList.add('fuera');setTimeout(function(){c.remove()},320)},Math.max(0,600-(performance.now()-t0)))}document.addEventListener('DOMContentLoaded',fuera);setTimeout(fuera,2200)})();</script>

<!-- Esta es la página que abre la tarjeta NFC del mostrador. -->
<main class="col">
  <div class="logo" data-logo></div>
  <div class="nfc-sello" id="dibujo" hidden></div>
  <div class="estado" aria-live="polite">
    <h1 id="titulo"></h1>
    <p id="detalle"></p>
  </div>
  <a class="btn" id="accion" href="index.html">Ver mi tarjeta</a>
</main>
<p class="firma">Hecho por <a href="https://www.mybdigitals.com" target="_blank" rel="noopener">MYB Digitals</a></p>

<script src="marca.js"></script>
<script src="datos.js"></script>
<script>
(function () {
  "use strict";
  const T = window.TARJETA, K = T.CONFIG, $ = (s) => document.querySelector(s);
  T.vestir();
  const codigo = T.guardado.leer("miTarjeta");
  const c = codigo ? T.porCodigo(codigo) : null;

  if (!c) {
    $("#titulo").textContent = "Primero sacá tu tarjeta";
    $("#detalle").textContent = "Te lleva un minuto.";
    $("#accion").textContent = "Sacar mi tarjeta";
    return;
  }
  const r = T.sumar(c.codigo, "nfc");
  if (!r.ok) {
    $("#titulo").textContent = "Ya sumaste tu sello de hoy";
    $("#detalle").textContent = "Nos vemos en tu próximo corte.";
    return;
  }
  const dibujo = $("#dibujo");
  dibujo.hidden = false;
  dibujo.innerHTML = T.sello(r.numero - 1, c.codigo, r.descuento > 0, true);
  if (navigator.vibrate) navigator.vibrate(35);
  $("#titulo").textContent = "Sello " + r.numero + " de " + K.sellos;
  $("#detalle").innerHTML = r.descuento
    ? "Este corte tiene <em>" + r.descuento + "% de descuento</em>"
    : "¡Listo, " + T.esc(c.nombre.split(" ")[0]) + "!";
})();
</script>
</body>
</html>
